modules:
  site: false
  text_posting: false
  video_posting: true
  # Publishing modules demand real credentials at startup, so the example that
  # is also a local launch target leaves them off: the dashboard reads durable
  # snapshots, not platform APIs.
  youtube: false
  instagram: false
  analytics: true

video:
  prepare_lead_minutes: 15
  reminder_minutes: 5
  retention_hours: 24

command_center:
  default_mode: video
