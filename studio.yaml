# Deployment behaviour that is not a publishing connection. Credentials live in
# .env; where this Studio publishes comes from the channel registry, which you
# fill in from the Command Center or over MCP.

# IANA zone used for every displayed schedule time; timezone_label is the short
# suffix shown next to it (e.g. "18:30 CET").
timezone: UTC
timezone_label: UTC

# Whether this Studio serves a public website. Off by default: most Studios
# publish to channels they already have and want the pipeline, not another site
# to look after. The Command Center is served either way. Turn this on and the
# site, its feeds, sitemap and the site delivery workers all start with it.
site_enabled: false

video:
  # How long before a scheduled slot the video is prepared, and how long before
  # it you are reminded. Retention is how long prepared media is kept.
  prepare_lead_minutes: 15
  reminder_minutes: 5
  retention_hours: 24

# What this Studio publishes as. Reaches RSS titles, llms.txt and the home
# page's structured data. Leave a language empty and it is simply not claimed;
# leave the name empty and the site names itself by its own domain. Nothing here
# defaults to anyone else's identity.
site:
  name:
    en: ""
    ru: ""
  tagline:
    en: ""
    ru: ""
  about:
    en: ""
    ru: ""
  # Listed in llms.txt and as `sameAs` on the home page. Empty means no social
  # block at all, which is the right answer until you have said otherwise.
  profiles:
    en: []
    ru: []
