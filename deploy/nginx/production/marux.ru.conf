server {
    listen 80;
    server_name marux.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/marux-acme;
    }

    location / {
        return 301 https://marux.ru$request_uri;
    }
}

server {
    listen 127.0.0.1:81;
    server_name marux.ru;
    client_max_body_size 1g;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
    }

    location = /command-center {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
    }

    location = /api/command-center {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
    }

    location = /api/command-center/action {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
    }

    # This Studio is operated from its own machine over MCP. Both routes reject
    # a request without the Studio bearer token, so the allowlist stays an
    # allowlist; media upload is separate because a post carries a file.
    location = /api/mcp {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location = /api/studio/media {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
        proxy_request_buffering off;
    }

    # Meta needs this URL while importing a Reel. The endpoint resolves only a
    # Studio video asset and exposes neither the dashboard nor the API.
    location ^~ /media/video/asset/ {
        proxy_pass http://127.0.0.1:8789;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
    }

    location / {
        return 404;
    }
}
