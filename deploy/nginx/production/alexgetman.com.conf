server {
    listen 80;
    server_name alexgetman.com www.alexgetman.com;
    return 301 https://alexgetman.com$request_uri;
}

server {
    listen 80;
    server_name data.alexgetman.com;
    return 301 https://data.alexgetman.com$request_uri;
}

server {
    listen 127.0.0.1:81;
    server_name alexgetman.com www.alexgetman.com;
    client_max_body_size 1g;

    # Everything the site serves — pages, feeds, sitemaps, Markdown twins,
    # /_astro, /media, /.well-known, cache headers, the Link header and the
    # noindex on operator surfaces — comes from the application. This file
    # routes hosts and nothing else.

    # A separate product on this host (telemostbot), not Solo Publisher.
    location ^~ /zoom/webhook {
        proxy_pass http://127.0.0.1:8799;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
    }
}
