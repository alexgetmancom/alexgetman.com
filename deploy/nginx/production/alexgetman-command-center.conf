# The dashboard authenticates with COMMAND_CENTER_TOKEN, and the application
# rate-limits guesses at it. A second HTTP Basic credential in front of that
# bought nothing the token does not already do, and had to be carried on every
# device. Requests are logged because this is now the only outside record of
# who reached the login screen.
add_header X-Robots-Tag "noindex, nofollow" always;
proxy_pass http://127.0.0.1:8788;
include /etc/nginx/snippets/alexgetman-proxy-headers.conf;
