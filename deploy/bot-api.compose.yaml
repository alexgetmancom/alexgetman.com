# The host's one Telegram Bot API server. Every Studio on the host reaches it
# over the shared network and mounts its download directory read-only; it is
# not part of any Studio, which is why it used to make one compose file
# different from the other.
name: bot-api

services:
  # The service key is the network alias every Studio resolves, so it, the
  # project and the container carry one name and not three.
  bot-api:
    image: aiogram/telegram-bot-api:10.2@sha256:6ab985144d46d024c723f4def72419d949b88ba97bf234dadf415051367a1b69
    container_name: bot-api
    restart: unless-stopped
    env_file:
      - ./telegram-bot-api.env
    environment:
      TELEGRAM_LOCAL: "1"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    volumes:
      - ${BOT_API_DATA_DIR_HOST:-/home/deploy/bot-api/data}:/var/lib/telegram-bot-api
      - ${BOT_API_TEMP_DIR_HOST:-/home/deploy/bot-api/temp}:/tmp/telegram-bot-api
    # The Studios reach it over the shared network, but the deploy agent is a
    # host service and reaches it here: without this its Telegram notifications
    # — including the button that promotes a release to the second Studio —
    # fail silently against a closed port.
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - agent_default

networks:
  agent_default:
    external: true
