name: ${PROJECT_NAME:-alexgetman}-backend

services:
  bot-api:
    image: aiogram/telegram-bot-api:10.2@sha256:6ab985144d46d024c723f4def72419d949b88ba97bf234dadf415051367a1b69
    container_name: alexgetman-telegram-bot-api
    restart: unless-stopped
    env_file:
      - ./telegram-bot-api.env
    environment:
      TELEGRAM_LOCAL: "1"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    volumes:
      - ./bot-api-data:/var/lib/telegram-bot-api
      - ./bot-api-temp:/tmp/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - agent_default

  backend:
    image: ${BACKEND_IMAGE:?set an immutable backend image digest}
    pull_policy: always
    container_name: alexgetman-backend
    # No `command:` — the image entrypoint starts the server itself (it fixes
    # bind-mount ownership as root first, then drops to uid 1000). A command
    # here would land as ignored arguments, not as Bun flags.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ./secrets.env
      - path: ./site-feed.env
        required: false
    group_add:
      - "${BOT_API_GID:-101}"
    depends_on:
      - bot-api
    environment:
      DATA_DIR: /data
      PIPELINE_DB: /data/pipeline.db
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      SITE_PUBLIC_DIR: /data/site
      TELEGRAM_CHANNEL_USERNAME: alexgetmancom
      METRICS_REFRESH_INTERVAL_SECONDS: "60"
      IDLE_POLL_INTERVAL_SECONDS: "5"
      TELEGRAM_API_BASE_URL: http://bot-api:8081
      OBSERVABILITY_INTERVAL_SECONDS: "300"
      REMOTE_MEDIA_PATH: /data/media
      PUBLIC_MEDIA_BASE_URL: https://alexgetman.com/media/staging
      GROK_HOME: /home/deploy/.grok
      GROK_CLI_PATH: /home/deploy/.grok/bin/grok
      MEDIA_CACHE_DIR: /data/media-cache
      VIDEO_MEDIA_DIR: /data/video-media
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      BIND_HOST: 0.0.0.0
      PORT: "8788"
    volumes:
      - ./data:/data
      - ${ALEX_MEDIA_CACHE_DIR_HOST:-./media-cache}:/data/media-cache
      - ${ALEX_VIDEO_MEDIA_DIR_HOST:-./video-media}:/data/video-media
      - ${ALEX_MEDIA_STAGING_DIR_HOST:-./media-staging}:/data/media
      - ./bot-api-data:/var/lib/telegram-bot-api:ro
      - /home/deploy/.grok:/home/deploy/.grok
      - ${ALEX_SITE_MEDIA_DIR_HOST:-/home/deploy/ialexey-web/media}:/data/site/media
    ports:
      - "127.0.0.1:8788:8788"
    extra_hosts:
      - "host.docker.internal:${DEPLOY_AGENT_HOST_GATEWAY:-host-gateway}"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8788/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agent_default
    mem_limit: 384m
    cpus: 1.0
    cpu_shares: 256
    pids_limit: 96

networks:
  agent_default:
    external: true
