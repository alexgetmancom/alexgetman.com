name: maru

services:
  backend:
    image: ${BACKEND_IMAGE:?set an immutable backend image digest}
    pull_policy: always
    container_name: maru-backend
    # No `command:` — see deploy/alex.compose.yaml: the image entrypoint owns
    # startup, and Bun flags such as --smol only work from the ENTRYPOINT.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./secrets.env
    group_add:
      - "${BOT_API_GID:-101}"
    environment:
      DATA_DIR: /data
      PIPELINE_DB: /data/pipeline.db
      MEDIA_CACHE_DIR: /data/media-cache
      REMOTE_MEDIA_PATH: /data/media
      PUBLIC_MEDIA_BASE_URL: ${MARU_PUBLIC_BASE_URL:?set this Studio's public base URL}/media/staging
      VIDEO_MEDIA_DIR: /data/video-media
      GROK_HOME: /home/deploy/.grok
      GROK_CLI_PATH: /home/deploy/.grok/bin/grok
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      # This is a media-only public endpoint for Meta to fetch Reels source
      # files. It does not make Maru serve the public site. There is no default:
      # a wrong value here hands a publishing platform a URL on someone else's
      # domain, and the request that proves it wrong comes from Meta, not a test.
      PUBLIC_BASE_URL: ${MARU_PUBLIC_BASE_URL:?set this Studio's public base URL}
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      TELEGRAM_API_BASE_URL: http://alexgetman-telegram-bot-api:8081
      METRICS_REFRESH_INTERVAL_SECONDS: "60"
      BIND_HOST: 0.0.0.0
      PORT: "8788"
    volumes:
      - ./data:/data
      - ${MARU_MEDIA_CACHE_DIR_HOST:-./media-cache}:/data/media-cache
      - ${MARU_VIDEO_MEDIA_DIR_HOST:-./video-media}:/data/video-media
      - ${MARU_MEDIA_STAGING_DIR_HOST:-./media-staging}:/data/media
      - ${MARU_BOT_API_DATA_DIR:-/home/deploy/alexgetman-runtime/bot-api-data}:/var/lib/telegram-bot-api:ro
      - /home/deploy/.grok:/home/deploy/.grok
    ports:
      - "127.0.0.1:8789:8788"
    # The deploy agent remains host-private; this alias is required for the
    # Telegram promotion and rollback controls inside the Maru backend.
    extra_hosts:
      - "host.docker.internal:${DEPLOY_AGENT_HOST_GATEWAY:-host-gateway}"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8788/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agent_default
    mem_limit: 384m
    cpus: 0.75
    cpu_shares: 256
    pids_limit: 96

networks:
  agent_default:
    external: true
