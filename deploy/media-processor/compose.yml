services:
  media-processor-deploy-agent:
    image: ${MEDIA_PROCESSOR_DEPLOY_AGENT_IMAGE:?set an immutable deploy-agent image digest}
    pull_policy: always
    container_name: media-processor-deploy-agent
    restart: unless-stopped
    env_file:
      - ./deploy-agent.env
    environment:
      DEPLOY_DEFAULT_TARGET: worker
      DEPLOY_COMPOSE_FILE: /runtime/compose.yml
      DEPLOY_IMAGE_ENV_FILE: /runtime/deploy-image.env
      DEPLOY_STATE_FILE: /state/state.json
      DEPLOY_HEALTH_URL: http://media-processor:8787/health
      DEPLOY_CONTAINER_NAME: studio-media-processor
      DEPLOY_SERVICE_NAME: media-processor
      DEPLOY_IMAGE_ENV_KEY: MEDIA_PROCESSOR_IMAGE
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/runtime
      - media_processor_deploy_state:/state
    ports:
      - "${MEDIA_PROCESSOR_DEPLOY_BIND_ADDRESS:-127.0.0.1}:9898:9898"

  media-processor:
    image: ${MEDIA_PROCESSOR_IMAGE:?set an immutable media-processor image digest}
    pull_policy: always
    container_name: studio-media-processor
    restart: unless-stopped
    # Loopback-only: the reverse SSH tunnel is the sole path from PS529.
    ports:
      - "${MEDIA_PROCESSOR_BIND_ADDRESS:-127.0.0.1}:9087:8787"
    environment:
      MEDIA_PROCESSOR_TOKEN: ${MEDIA_PROCESSOR_TOKEN:?set MEDIA_PROCESSOR_TOKEN}
      MEDIA_PROCESSOR_MAX_BYTES: ${MEDIA_PROCESSOR_MAX_BYTES:-1073741824}
      MEDIA_PROCESSOR_TIMEOUT_SECONDS: ${MEDIA_PROCESSOR_TIMEOUT_SECONDS:-900}
    volumes:
      - media_processor_jobs:/work
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128

volumes:
  media_processor_jobs:
  media_processor_deploy_state:
