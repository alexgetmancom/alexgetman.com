name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "LICENSE"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  scope:
    name: Determine changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      media_changed: ${{ steps.filter.outputs.media }}
      dependencies_changed: ${{ steps.filter.outputs.dependencies }}
      backend_image_changed: ${{ steps.filter.outputs.backend_image }}
      runtime_config_changed: ${{ steps.filter.outputs.runtime_config }}
      deploy_agent_changed: ${{ steps.filter.outputs.deploy_agent }}
      caddy_config_changed: ${{ steps.filter.outputs.caddy_config }}
      deployment_required: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        if: github.event_name != 'schedule'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha=$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)
          fi

          media=false
          dependencies=false
          backend_image=false
          runtime_config=false
          deploy_agent=false
          caddy_config=false
          deployment=false

          while IFS= read -r path; do
            case "$path" in
              deploy/media-processor/compose.yml|deploy/media-processor/Dockerfile|deploy/media-processor/Dockerfile.runtime-base|deploy/media-processor/server.ts|deploy/media-processor/service.ts|deploy/media-processor/serial-queue.ts|deploy/media-processor/story-encode.ts)
                media=true
                deployment=true
                ;;
              bun.lock | package.json | */package.json)
                dependencies=true
                backend_image=true
                deployment=true
                ;;
              apps/web/*|apps/backend/src/*|apps/backend/assets/*|apps/backend/drizzle/*|apps/backend/tsconfig.json|apps/backend/Dockerfile.release|apps/backend/Dockerfile.runtime-base|astro.config.ts|bunfig.toml|scripts/generate-responsive-images.ts|scripts/image-smoke.ts|apps/backend/tests/helpers/studio-site.yaml|svelte.config.ts|tsconfig.base.json|tsconfig.json)
                backend_image=true
                deployment=true
                ;;
              deploy/alex.compose.yaml | deploy/maru.compose.yaml | studio.alex.yaml | studio.maru.yaml)
                runtime_config=true
                deployment=true
                ;;
              deploy/deploy-agent.ts | deploy/retry.ts)
                deploy_agent=true
                deployment=true
                ;;
              deploy/caddy/*)
                caddy_config=true
                deployment=true
                ;;
              .github/workflows/check.yml)
                backend_image=true
                deployment=true
                ;;
            esac
          done < <(git diff --name-only --no-renames "$base_sha" "$HEAD_SHA")

          {
            echo "media=$media"
            echo "dependencies=$dependencies"
            echo "backend_image=$backend_image"
            echo "runtime_config=$runtime_config"
            echo "deploy_agent=$deploy_agent"
            echo "caddy_config=$caddy_config"
            echo "deployment=$deployment"
          } >> "$GITHUB_OUTPUT"

          echo "Changed areas: media=$media dependencies=$dependencies backend_image=$backend_image runtime_config=$runtime_config caddy_config=$caddy_config deployment=$deployment"

  deployment-status-pending:
    name: Production deployment
    needs: scope
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.deployment_required == 'true'
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark production deployment as pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending \
            -f context='production deployment' \
            -f description='Waiting for CI and production deployment' \
            -f target_url="$TARGET_URL"

  quality-static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: TypeScript-only language gate
        run: bun run check:language
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Svelte check
        run: bun run check:svelte

  quality-analysis:
    name: Repository analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: Dead-code report
        run: bun run knip
      - name: Layer boundaries
        run: bun run check:layers
      - name: Dockerfile workspace manifests
        run: bun run check:docker
      - name: Self-host stack
        # The install path published in the README is not exercised by anything
        # else here: nothing in this repository runs it, so without this it
        # rots silently and the first person to find out is a stranger.
        run: |
          set -euo pipefail
          sed 's/^DOMAIN=.*/DOMAIN=publisher.example.com/' .env.example > .env
          docker compose -f compose.yaml config --quiet
          rm -f .env
          docker compose -f deploy/caddy/compose.yaml config --quiet
          for file in Caddyfile deploy/caddy/Caddyfile; do
            docker run --rm -v "$PWD/$file:/etc/caddy/Caddyfile:ro" \
              -e DOMAIN=publisher.example.com -e ACME_EMAIL=ci@example.com \
              caddy:2.10-alpine sh -c 'caddy fmt /etc/caddy/Caddyfile >/dev/null && caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile'
            # Assert on what Caddy builds, not on what the file says. A snippet
            # that silently fails to expand leaves every visitor arriving as the
            # proxy, which turns the application's rate limit into one global
            # budget and looks completely healthy from outside. Caddy
            # canonicalises the header to X-Real-Ip, so match that spelling.
            adapted=$(docker run --rm -v "$PWD/$file:/etc/caddy/Caddyfile:ro" \
              -e DOMAIN=publisher.example.com -e ACME_EMAIL=ci@example.com \
              caddy:2.10-alpine caddy adapt --adapter caddyfile --config /etc/caddy/Caddyfile)
            proxies=$(grep -o '"handler":"reverse_proxy"' <<<"$adapted" | wc -l)
            addressed=$(grep -o '"X-Real-Ip"' <<<"$adapted" | wc -l)
            test "$proxies" -gt 0
            test "$proxies" = "$addressed" || { echo "$file: $proxies proxies but $addressed set the client address"; exit 1; }
          done

  quality-tests:
    name: Tests with coverage threshold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: Install production ffmpeg binaries
        env:
          FFMPEG_IMAGE: mwader/static-ffmpeg:6.1.1@sha256:a44cd22b260c527f54e99517186a209b805d0a2319e0886d356e840f62a72132
        run: |
          container=$(docker create "$FFMPEG_IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/ffmpeg" /tmp/ffmpeg
          docker cp "$container:/ffprobe" /tmp/ffprobe
          sudo install -m 0755 /tmp/ffmpeg /tmp/ffprobe /usr/local/bin/
      - name: Tests with coverage threshold
        run: bun run test:coverage

  build:
    name: Build web and backend artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: Build checked web
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          CI: "true"
          DATA_DIR: apps/web/src/data
        run: |
          bun run check:web
          bun build apps/web/server.ts --outdir runtime --target bun
          bun build apps/backend/src/cli.ts --outdir ops --target bun
          bun build apps/backend/src/runtime/docker-entrypoint.ts --outdir entrypoint --target bun
          bun build apps/backend/src/runtime/config-check.ts --outdir entrypoint --target bun
          test -f entrypoint/docker-entrypoint.js
          test -f entrypoint/config-check.js
          grep -q '"/app/entrypoint/docker-entrypoint.js"' apps/backend/Dockerfile
          grep -q '"/app/entrypoint/docker-entrypoint.js"' apps/backend/Dockerfile.release
          bun build apps/backend/src/story-cards/renderer-process.ts --outdir story-renderer --target bun
          test -f story-renderer/renderer-process.js
          bun build scripts/image-smoke.ts --outdir smoke --target bun
          test -f smoke/image-smoke.js
      - name: Build immutable production artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI: "true"
          DATA_DIR: /data
        run: |
          bun run build
          bun build apps/web/server.ts --outdir runtime --target bun --splitting --minify --sourcemap=external
          bun build apps/backend/src/cli.ts --outdir ops --target bun --minify --sourcemap=external
          bun build apps/backend/src/runtime/docker-entrypoint.ts --outdir entrypoint --target bun --minify --sourcemap=external
          bun build apps/backend/src/runtime/config-check.ts --outdir entrypoint --target bun --minify --sourcemap=external
          test -f entrypoint/docker-entrypoint.js
          test -f entrypoint/config-check.js
          STUDIO_CONFIG="$PWD/studio.alex.yaml" bun entrypoint/config-check.js
          STUDIO_CONFIG="$PWD/studio.maru.yaml" bun entrypoint/config-check.js
          STUDIO_CONFIG="$PWD/studio.yaml" bun entrypoint/config-check.js
          grep -q '"/app/entrypoint/docker-entrypoint.js"' apps/backend/Dockerfile
          grep -q '"/app/entrypoint/docker-entrypoint.js"' apps/backend/Dockerfile.release
          bun build apps/backend/src/story-cards/renderer-process.ts --outdir story-renderer --target bun --minify --sourcemap=external
          test -f story-renderer/renderer-process.js
          bun build scripts/image-smoke.ts --outdir smoke --target bun
          test -f smoke/image-smoke.js
          test -n "$(find dist -type f -print -quit)"
          test -n "$(find runtime -type f -print -quit)"
          test -n "$(find ops -type f -print -quit)"
      - name: Upload immutable backend artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-build-${{ github.sha }}
          path: |
            dist
            runtime
            ops
            entrypoint
            story-renderer
            smoke
            apps/backend/drizzle
            apps/backend/assets
          if-no-files-found: error
          retention-days: 1

  dependency-audit:
    name: Dependency audit
    needs: scope
    if: needs.scope.outputs.dependencies_changed == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: Dependency audit
        run: bun run check:audit

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Image builds do not wait for the quality gates. The gates are enforced on
  # `deploy`, so a red commit can at worst leave a published tag that nothing
  # ever activates.
  backend-image-reuse:
    name: Resolve published backend image
    needs: [scope]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.outputs.deployment_required == 'true'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.reuse.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Decided once rather than inside each architecture's build: two legs
      # reading the same tag could disagree if `latest` moved between them, and
      # then one architecture would be rebuilt while the other was reused.
      - name: Resolve published backend image
        id: reuse
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher:latest
          IMAGE_CHANGED: ${{ needs.scope.outputs.backend_image_changed }}
        run: |
          set -euo pipefail

          if [ "$IMAGE_CHANGED" = "true" ]; then
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "Backend sources changed; building"
            exit 0
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)
          if [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing published backend image $IMAGE@$digest"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "No published backend image found; falling back to a full build"
          fi

  backend-image:
    # One build per architecture on a runner of that architecture. QEMU would
    # let one runner produce both, but emulating the Bun install and sharp turns
    # a short build into a long one for nothing: arm64 runners are free for
    # public repositories. Each leg pushes by digest — sharing a tag would make
    # the two legs overwrite each other — and the manifest job joins them.
    name: Build backend image (${{ matrix.arch }})
    needs: [scope, build, backend-image-reuse]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.outputs.deployment_required == 'true' &&
      needs.backend-image-reuse.outputs.digest == ''
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout source for backend image and smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Download checked backend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build-${{ github.sha }}
          path: .
      - name: Resolve backend runtime base
        id: runtime_base
        env:
          BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher:runtime-${{ matrix.arch }}-${{ hashFiles('bun.lock', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json', 'apps/backend/Dockerfile.runtime-base') }}
        run: |
          echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing backend runtime base $BASE_IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Building backend runtime base $BASE_IMAGE"
          fi
      - name: Build and publish backend runtime base
        if: steps.runtime_base.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/backend/Dockerfile.runtime-base
          push: true
          tags: ${{ steps.runtime_base.outputs.image }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/solo-publisher:buildcache-runtime-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/solo-publisher:buildcache-runtime-${{ matrix.arch }},mode=max
      - name: Build and publish backend image
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/backend/Dockerfile.release
          target: app
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.runtime_base.outputs.image }}
            GIT_REVISION=${{ github.sha }}
          # Pushed by digest with no tag: the two architectures are joined into
          # one tag by the manifest job. `latest` is moved by the deploy job,
          # because the reuse check above reads it and it must keep meaning
          # "the image production is running".
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/solo-publisher,push-by-digest=true,name-canonical=true,push=true
          # No build cache here on purpose: this stage is COPY of per-commit
          # artifacts onto the runtime base, so nothing is ever reusable and the
          # export was writing ~70s of cache no build could hit.
      - name: Set up Bun for image smoke test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # Runs on each architecture's own runner against that architecture's
      # image, so a self-hosted arm64 install is covered by the same walk of the
      # SSR routes, the ops CLI and ffmpeg that amd64 gets.
      - name: Image smoke test
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher@${{ steps.build_image.outputs.digest }}
          DRIZZLE_MIGRATIONS_DIR: apps/backend/drizzle
        run: bun smoke/image-smoke.js
      - name: Record digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          printf '%s' '${{ steps.build_image.outputs.digest }}' > "/tmp/digests/${{ matrix.arch }}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  backend-manifest:
    name: Join backend architectures
    needs: [scope, backend-image-reuse, backend-image]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.outputs.deployment_required == 'true' &&
      (needs.backend-image.result == 'success' || needs.backend-image.result == 'skipped')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download digests
        if: needs.backend-image-reuse.outputs.digest == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-digest-*
          merge-multiple: true
          path: /tmp/digests
      - name: Join or reuse
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher
          TAG: ${{ github.sha }}
          REUSED_DIGEST: ${{ needs.backend-image-reuse.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -n "$REUSED_DIGEST" ]; then
            printf '%s\n' "$REUSED_DIGEST" | grep -Eq '^sha256:[0-9a-fA-F]{64}$'
            echo "digest=$REUSED_DIGEST" >> "$GITHUB_OUTPUT"
            echo "Reusing $IMAGE@$REUSED_DIGEST"
            exit 0
          fi

          # Every architecture must be present. A missing one would silently
          # publish a single-architecture image under a name the README tells
          # people to run on both.
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "/tmp/digests/$arch")
            printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-fA-F]{64}$'
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create -t "$IMAGE:$TAG" "${sources[@]}"

          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" | awk '$1 == "Digest:" { print $2; exit }')
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-fA-F]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          platforms=$(docker buildx imagetools inspect "$IMAGE@$digest" | awk '$1 == "Platform:" { print $2 }' | sort -u | tr '\n' ' ')
          echo "Published $IMAGE:$TAG@$digest for: $platforms"
          grep -q "linux/amd64" <<<"$platforms"
          grep -q "linux/arm64" <<<"$platforms"

  media-processor-image:
    name: Build media processor image
    needs: [scope]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.outputs.deployment_required == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/media-processor.yml
    with:
      build-image: ${{ needs.scope.outputs.media_changed == 'true' }}
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy:
    name: Deploy immutable image
    needs:
      [
        scope,
        quality-static,
        quality-analysis,
        quality-tests,
        dependency-audit,
        backend-manifest,
        media-processor-image,
      ]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.deployment_required == 'true' &&
      needs.quality-static.result == 'success' &&
      needs.quality-analysis.result == 'success' &&
      needs.quality-tests.result == 'success' &&
      (needs.dependency-audit.result == 'success' || needs.dependency-audit.result == 'skipped') &&
      needs.backend-manifest.result == 'success' &&
      needs.media-processor-image.result == 'success'
    permissions:
      contents: read
      statuses: write
      packages: write
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Configure known hosts
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Activate image and verify readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_AGENT_TOKEN: ${{ secrets.DEPLOY_AGENT_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher@${{ needs.backend-manifest.outputs.image_digest }}
          MEDIA_PROCESSOR_IMAGE: ghcr.io/${{ github.repository_owner }}/alexgetman-media-processor@${{ needs.media-processor-image.outputs.image_digest }}
          RELEASE: ${{ github.sha }}
          MARU_DEPLOY_ENABLED: ${{ vars.MARU_DEPLOY_ENABLED }}
          RUNTIME_CONFIG_CHANGED: ${{ needs.scope.outputs.runtime_config_changed }}
          DEPLOY_AGENT_CHANGED: ${{ needs.scope.outputs.deploy_agent_changed }}
          CADDY_CONFIG_CHANGED: ${{ needs.scope.outputs.caddy_config_changed }}
        run: |
          phase_started=$SECONDS
          phase() {
            now=$SECONDS
            printf '::notice::deploy timing: %s=%ss\n' "$1" "$((now - phase_started))"
            phase_started=$now
          }
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_AGENT_TOKEN"
          ssh_control="$RUNNER_TEMP/deploy-ssh-%C"
          ssh_opts=(-o BatchMode=yes -o ControlMaster=auto -o ControlPersist=60 -o "ControlPath=$ssh_control")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          media_release=$(printf '{"release":"%s","image":"%s"}\n' "$RELEASE" "$MEDIA_PROCESSOR_IMAGE")
          ssh "${ssh_opts[@]}" "$remote" "install -d -m 0700 /var/lib/alexgetman-deploy"
          ssh "${ssh_opts[@]}" "$remote" "umask 077; printf '%s\\n' '$media_release' > /var/lib/alexgetman-deploy/media-processor-release.json"
          runtime=/home/deploy/alexgetman-runtime
          caddy_runtime=/home/deploy/caddy
          release_files="$runtime/release-files/$RELEASE"
          ssh "${ssh_opts[@]}" "$remote" "install -d -m 0700 '$release_files'"
          release_paths=()
          if [ "$RUNTIME_CONFIG_CHANGED" = "true" ]; then
            release_paths+=(deploy/alex.compose.yaml deploy/maru.compose.yaml studio.alex.yaml studio.maru.yaml)
          fi
          if [ "$DEPLOY_AGENT_CHANGED" = "true" ]; then
            release_paths+=(deploy/deploy-agent.ts deploy/retry.ts)
          fi
          if [ "$CADDY_CONFIG_CHANGED" = "true" ]; then
            release_paths+=(deploy/caddy/Caddyfile deploy/caddy/compose.yaml)
          fi
          if [ "${#release_paths[@]}" -gt 0 ]; then
            tar -cf - "${release_paths[@]}" | ssh "${ssh_opts[@]}" "$remote" "tar -xf - -C '$release_files'"
          fi
          if [ "$RUNTIME_CONFIG_CHANGED" = "true" ]; then
            ssh "${ssh_opts[@]}" "$remote" "set -e; cp '$release_files/deploy/alex.compose.yaml' $runtime/compose.yaml.next; cp '$release_files/studio.alex.yaml' $runtime/studio.yaml.next; docker compose --env-file $runtime/deploy-image.env -f $runtime/compose.yaml.next config --quiet; mv $runtime/compose.yaml.next $runtime/compose.yaml; mv $runtime/studio.yaml.next $runtime/studio.yaml"
          fi
          if [ "$DEPLOY_AGENT_CHANGED" = "true" ]; then
            ssh "${ssh_opts[@]}" "$remote" "set -e; install -m 0644 '$release_files/deploy/deploy-agent.ts' /home/deploy/repos/alexgetman.com/deploy/deploy-agent.ts; install -m 0644 '$release_files/deploy/retry.ts' /home/deploy/repos/alexgetman.com/deploy/retry.ts; sudo systemctl restart alexgetman-deploy-agent; for attempt in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:9899/healthz && exit 0; sleep 1; done; exit 1"
          fi
          if [ "$MARU_DEPLOY_ENABLED" = "true" ]; then
            maru_runtime=/home/deploy/maru
            if [ "$RUNTIME_CONFIG_CHANGED" = "true" ]; then
              ssh "${ssh_opts[@]}" "$remote" "set -e; runtime=$maru_runtime; cp '$release_files/deploy/maru.compose.yaml' \$runtime/maru.compose.yaml.next; cp '$release_files/studio.maru.yaml' \$runtime/studio.yaml.next; docker compose --env-file \$runtime/deploy-image.env -f \$runtime/maru.compose.yaml.next config --quiet; mv \$runtime/maru.compose.yaml.next \$runtime/maru.compose.yaml; mv \$runtime/studio.yaml.next \$runtime/studio.yaml"
            fi
          fi
          phase runtime-config
          if [ "$CADDY_CONFIG_CHANGED" = "true" ]; then
            caddy_files="$release_files/deploy/caddy"
            # `caddy validate` parses the file the container will read, so a
            # typo fails here instead of taking every domain down on reload.
            # A reload keeps connections; it does not restart the proxy.
            ssh "${ssh_opts[@]}" "$remote" "set -e; cp '$caddy_files/Caddyfile' $caddy_runtime/Caddyfile.next; cp '$caddy_files/compose.yaml' $caddy_runtime/compose.yaml.next; docker compose -f $caddy_runtime/compose.yaml.next config --quiet; docker exec -i caddy caddy validate --adapter caddyfile --config - < $caddy_runtime/Caddyfile.next; mv $caddy_runtime/Caddyfile.next $caddy_runtime/Caddyfile; mv $caddy_runtime/compose.yaml.next $caddy_runtime/compose.yaml; docker exec caddy caddy reload --config /etc/caddy/Caddyfile"
          fi
          phase caddy-config
          payload=$(printf '{"image":"%s","release":"%s"}' "$IMAGE" "$RELEASE")
          ssh "${ssh_opts[@]}" "$remote" "curl --fail-with-body --silent --show-error --max-time 180 -H 'Authorization: Bearer $DEPLOY_AGENT_TOKEN' -H 'Content-Type: application/json' --data '$payload' http://127.0.0.1:9899/v1/deploy"
          phase backend-activation
          curl --fail --silent --show-error --retry 3 --retry-all-errors https://alexgetman.com/readyz &
          public_ready_pid=$!
          ssh "${ssh_opts[@]}" "$remote" "curl --fail --silent --show-error --retry 3 --retry-all-errors http://127.0.0.1:8789/readyz" &
          private_ready_pid=$!
          public_ready_status=0
          private_ready_status=0
          wait "$public_ready_pid" || public_ready_status=$?
          wait "$private_ready_pid" || private_ready_status=$?
          test "$public_ready_status" -eq 0
          test "$private_ready_status" -eq 0
          phase readiness
          # Reconcile deploy-image.env with what is now actually running, so a
          # manual `docker compose up` on the host starts the release that was
          # just verified. Two things this got wrong before:
          #   - it ran before the activation, so it asserted that the *previous*
          #     deploy named the expected repository. Renaming the image made
          #     that permanently false and wedged every future deploy behind a
          #     check about the past;
          #   - it read state.json, which the agent stopped writing when state
          #     became per-target. That file last changed in July, so the check
          #     passed on a months-old release and verified nothing at all.
          ssh "${ssh_opts[@]}" "$remote" "set -e; runtime=$runtime; image=\$(bun -e 'const state=JSON.parse(await Bun.file(\"/var/lib/alexgetman-deploy/alex.json\").text()); process.stdout.write(state.current?.image ?? \"\")'); printf '%s\\n' \"\$image\" | grep -Eq '^ghcr.io/alexgetmancom/solo-publisher@sha256:[0-9a-fA-F]{64}\$' || exit 1; test \"\$image\" = '$IMAGE'; if ! grep -Eq \"^BACKEND_IMAGE=\$image\\\$\" \"\$runtime/deploy-image.env\"; then tmp=\"\$runtime/deploy-image.env.next\"; { grep -v '^BACKEND_IMAGE=' \"\$runtime/deploy-image.env\" || true; printf 'BACKEND_IMAGE=%s\\n' \"\$image\"; } > \"\$tmp\"; mv \"\$tmp\" \"\$runtime/deploy-image.env\"; fi"
          # Only the primary revision. The second Studio is promoted by hand from
          # the agent's notification, so reconciling its image here would assert
          # something this workflow never performed — and would fail on every run
          # until someone happened to promote it.
          phase image-reconciliation
          # Release files are safe to remove after readiness. Docker cache cleanup
          # is intentionally handled outside the deployment critical path.
          ssh "${ssh_opts[@]}" "$remote" "rm -rf '$release_files'"
          phase cleanup
          ssh "${ssh_opts[@]}" -O exit "$remote" || true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Moved only once production is serving this digest, so the reuse path in
      # the image job can never pick up something that was never deployed.
      - name: Point latest at the deployed image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher
          DIGEST: ${{ needs.backend-manifest.outputs.image_digest }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
      # Published here rather than from a follow-up job: a whole runner boot for
      # one API call sat on the tail of every green deployment.
      - name: Publish production status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success \
            -f context='production deployment' \
            -f description='Image activated and production readiness passed' \
            -f target_url="$TARGET_URL"

  deployment-status-on-ci-failure:
    name: Production deployment status on CI failure
    needs:
      [
        scope,
        quality-static,
        quality-analysis,
        quality-tests,
        dependency-audit,
        deployment-status-pending,
      ]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (
        needs.scope.result != 'success' ||
        needs.quality-static.result != 'success' ||
        needs.quality-analysis.result != 'success' ||
        needs.quality-tests.result != 'success' ||
        (needs.dependency-audit.result != 'success' && needs.dependency-audit.result != 'skipped')
      )
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark production deployment as blocked
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=failure \
            -f context='production deployment' \
            -f description='CI failed; production deployment was not started' \
            -f target_url="$TARGET_URL"

  # Only the paths `deploy` cannot report on itself: nothing to deploy, or a
  # deployment that never reached its final step.
  deployment-status:
    name: Production deployment status
    needs:
      [
        scope,
        quality-static,
        quality-analysis,
        quality-tests,
        dependency-audit,
        backend-manifest,
        media-processor-image,
        deploy,
      ]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.deploy.result != 'success' &&
      needs.scope.result == 'success' &&
      needs.quality-static.result == 'success' &&
      needs.quality-analysis.result == 'success' &&
      needs.quality-tests.result == 'success' &&
      (needs.dependency-audit.result == 'success' || needs.dependency-audit.result == 'skipped')
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish final production status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT_REQUIRED: ${{ needs.scope.outputs.deployment_required }}
        run: |
          if [ "$DEPLOYMENT_REQUIRED" != "true" ]; then
            state=success
            description='CI passed; production unchanged'
          else
            state=failure
            description='Docker build or production deployment failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='production deployment' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
