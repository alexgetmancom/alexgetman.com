name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  scope:
    name: Determine changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      media_changed: ${{ steps.filter.outputs.media }}
      dependencies_changed: ${{ steps.filter.outputs.dependencies }}
      backend_image_changed: ${{ steps.filter.outputs.backend_image }}
      runtime_config_changed: ${{ steps.filter.outputs.runtime_config }}
      nginx_config_changed: ${{ steps.filter.outputs.nginx_config }}
      deployment_required: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        if: github.event_name != 'schedule'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha=$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)
          fi

          media=false
          dependencies=false
          backend_image=false
          runtime_config=false
          nginx_config=false
          deployment=false

          while IFS= read -r path; do
            case "$path" in
              deploy/media-processor/compose.yml|deploy/media-processor/Dockerfile|deploy/media-processor/Dockerfile.runtime-base|deploy/media-processor/server.ts|deploy/media-processor/service.ts|deploy/media-processor/serial-queue.ts|deploy/media-processor/story-encode.ts)
                media=true
                deployment=true
                ;;
              bun.lock | package.json | */package.json)
                dependencies=true
                backend_image=true
                deployment=true
                ;;
              apps/web/*|apps/backend/src/*|apps/backend/assets/*|apps/backend/drizzle/*|apps/backend/tsconfig.json|apps/backend/Dockerfile.release|apps/backend/Dockerfile.runtime-base|astro.config.ts|bunfig.toml|scripts/generate-responsive-images.ts|svelte.config.ts|tsconfig.base.json|tsconfig.json)
                backend_image=true
                deployment=true
                ;;
              apps/backend/compose.yaml | deploy/maru.compose.yaml)
                runtime_config=true
                deployment=true
                ;;
              deploy/nginx/production/*)
                nginx_config=true
                deployment=true
                ;;
              .github/workflows/check.yml)
                backend_image=true
                deployment=true
                ;;
            esac
          done < <(git diff --name-only --no-renames "$base_sha" "$HEAD_SHA")

          {
            echo "media=$media"
            echo "dependencies=$dependencies"
            echo "backend_image=$backend_image"
            echo "runtime_config=$runtime_config"
            echo "nginx_config=$nginx_config"
            echo "deployment=$deployment"
          } >> "$GITHUB_OUTPUT"

          echo "Changed areas: media=$media dependencies=$dependencies backend_image=$backend_image runtime_config=$runtime_config nginx_config=$nginx_config deployment=$deployment"

  deployment-status-pending:
    name: Production deployment
    needs: scope
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.deployment_required == 'true'
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark production deployment as pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending \
            -f context='production deployment' \
            -f description='Waiting for CI and production deployment' \
            -f target_url="$TARGET_URL"

  quality-static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: TypeScript-only language gate
        run: bun run check:language
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Svelte check
        run: bun run check:svelte

  quality-analysis:
    name: Repository analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: Dead-code report
        run: bun run knip
      - name: Layer boundaries
        run: bun run check:layers
      - name: Dockerfile workspace manifests
        run: bun run check:docker

  quality-tests:
    name: Tests with coverage threshold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: Install video test runtime
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Tests with coverage threshold
        run: bun run test:coverage

  build:
    name: Build web and backend artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: Build checked web
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          CI: "true"
          DATA_DIR: apps/web/src/data
        run: |
          bun run check:web
          bun build apps/web/server.ts --outdir runtime --target bun
          bun build apps/backend/src/cli.ts --outdir ops --target bun
          bun build apps/backend/src/runtime/docker-entrypoint.ts --outdir entrypoint --target bun
          test -f entrypoint/docker-entrypoint.js
          grep -q '"/app/entrypoint/docker-entrypoint.js"' apps/backend/Dockerfile
          grep -q '"/app/entrypoint/docker-entrypoint.js"' apps/backend/Dockerfile.release
          bun build apps/backend/src/story-cards/renderer-process.ts --outdir story-renderer --target bun
          test -f story-renderer/renderer-process.js
          bun build scripts/image-smoke.ts --outdir smoke --target bun
          test -f smoke/image-smoke.js
      - name: Build immutable production artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI: "true"
          DATA_DIR: /data
        run: |
          bun run build
          bun build apps/web/server.ts --outdir runtime --target bun --splitting --minify --sourcemap=external
          bun build apps/backend/src/cli.ts --outdir ops --target bun --minify --sourcemap=external
          bun build apps/backend/src/runtime/docker-entrypoint.ts --outdir entrypoint --target bun --minify --sourcemap=external
          test -f entrypoint/docker-entrypoint.js
          grep -q '"/app/entrypoint/docker-entrypoint.js"' apps/backend/Dockerfile
          grep -q '"/app/entrypoint/docker-entrypoint.js"' apps/backend/Dockerfile.release
          bun build apps/backend/src/story-cards/renderer-process.ts --outdir story-renderer --target bun --minify --sourcemap=external
          test -f story-renderer/renderer-process.js
          # Bundled so the image job runs the smoke test on a bare bun, without
          # restoring and installing the whole workspace.
          bun build scripts/image-smoke.ts --outdir smoke --target bun
          test -f smoke/image-smoke.js
          test -n "$(find dist -type f -print -quit)"
          test -n "$(find runtime -type f -print -quit)"
          test -n "$(find ops -type f -print -quit)"
      - name: Upload immutable backend artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-build-${{ github.sha }}
          path: |
            dist
            runtime
            ops
            entrypoint
            story-renderer
            smoke
            apps/backend/drizzle
            apps/backend/assets
          if-no-files-found: error
          retention-days: 1

  dependency-audit:
    name: Dependency audit
    needs: scope
    if: needs.scope.outputs.dependencies_changed == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14
          cache-key: bun-workspace-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json') }}
      - name: Dependency audit
        run: bun run check:audit

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Image builds do not wait for the quality gates: they only need the scope and
  # the artifacts from `build`. The gates are enforced on `deploy`, so a red
  # commit can at worst leave a published tag that nothing ever activates.
  backend-image:
    name: Build or reuse backend image
    needs: [scope, build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve published backend image
        id: reuse
        if: needs.scope.outputs.backend_image_changed != 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/alexgetman-backend:latest
        run: |
          set -euo pipefail

          digest=$(docker buildx imagetools inspect "$IMAGE" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)
          if [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing published backend image $IMAGE@$digest"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "No published backend image found; falling back to a full build"
          fi
      # Only a real build needs a buildkit builder; the reuse path above runs on
      # the buildx plugin the runner already ships, and skipping the builder
      # keeps ~24s out of the reuse path.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: needs.scope.outputs.backend_image_changed == 'true' || steps.reuse.outputs.digest == ''
      - name: Checkout source for backend image and smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Always downloaded: the reuse path skips the build but still runs the
      # smoke test out of the bundled `smoke/`.
      - name: Download checked backend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build-${{ github.sha }}
          path: .
      - name: Resolve backend runtime base
        id: runtime_base
        if: needs.scope.outputs.backend_image_changed == 'true' || steps.reuse.outputs.digest == ''
        env:
          BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/alexgetman-backend:runtime-${{ hashFiles('bun.lock', 'package.json', 'apps/backend/package.json', 'tools/knip/package.json', 'tools/svelte-check/package.json', 'tools/layer-checker/package.json', 'apps/backend/Dockerfile.runtime-base') }}
        run: |
          echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing backend runtime base $BASE_IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Building backend runtime base $BASE_IMAGE"
          fi
      - name: Build and publish backend runtime base
        if: >-
          (needs.scope.outputs.backend_image_changed == 'true' || steps.reuse.outputs.digest == '') &&
          steps.runtime_base.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/backend/Dockerfile.runtime-base
          push: true
          tags: |
            ${{ steps.runtime_base.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/alexgetman-backend:runtime-base
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/alexgetman-backend:buildcache-runtime
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/alexgetman-backend:buildcache-runtime,mode=max
      - name: Build and publish backend image
        id: build_image
        if: needs.scope.outputs.backend_image_changed == 'true' || steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/backend/Dockerfile.release
          target: app
          build-args: |
            RUNTIME_BASE_IMAGE=${{ steps.runtime_base.outputs.image }}
            GIT_REVISION=${{ github.sha }}
          push: true
          # `latest` is moved by the deploy job, not here: the reuse path above
          # reads it, so it must mean "the image production is running".
          tags: ghcr.io/${{ github.repository_owner }}/alexgetman-backend:${{ github.sha }}
          # No build cache here on purpose: this stage is COPY of per-commit
          # artifacts onto the runtime base, so nothing is ever reusable and the
          # export was writing ~70s of cache no build could hit.
      - name: Select backend image digest
        id: image
        env:
          BUILT_DIGEST: ${{ steps.build_image.outputs.digest }}
          REUSED_DIGEST: ${{ steps.reuse.outputs.digest }}
        run: |
          set -euo pipefail

          digest="$BUILT_DIGEST"
          if [ -z "$digest" ]; then
            digest="$REUSED_DIGEST"
          fi
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-fA-F]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Image smoke test
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/alexgetman-backend@${{ steps.image.outputs.digest }}
          # The bundle has no source layout to resolve the migrations against.
          DRIZZLE_MIGRATIONS_DIR: apps/backend/drizzle
        run: bun smoke/image-smoke.js

  media-processor-image:
    name: Build media processor image
    needs: [scope]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/media-processor.yml
    with:
      build-image: ${{ needs.scope.outputs.media_changed == 'true' }}
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy:
    name: Deploy immutable image
    needs:
      [
        scope,
        quality-static,
        quality-analysis,
        quality-tests,
        dependency-audit,
        backend-image,
        media-processor-image,
      ]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.deployment_required == 'true' &&
      needs.quality-static.result == 'success' &&
      needs.quality-analysis.result == 'success' &&
      needs.quality-tests.result == 'success' &&
      (needs.dependency-audit.result == 'success' || needs.dependency-audit.result == 'skipped') &&
      needs.backend-image.result == 'success' &&
      needs.media-processor-image.result == 'success'
    permissions:
      contents: read
      statuses: write
      packages: write
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Configure known hosts
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Activate image and verify readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_AGENT_TOKEN: ${{ secrets.DEPLOY_AGENT_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/alexgetman-backend@${{ needs.backend-image.outputs.image_digest }}
          MEDIA_PROCESSOR_IMAGE: ghcr.io/${{ github.repository_owner }}/alexgetman-media-processor@${{ needs.media-processor-image.outputs.image_digest }}
          RELEASE: ${{ github.sha }}
          MARU_DEPLOY_ENABLED: ${{ vars.MARU_DEPLOY_ENABLED }}
          RUNTIME_CONFIG_CHANGED: ${{ needs.scope.outputs.runtime_config_changed }}
          NGINX_CONFIG_CHANGED: ${{ needs.scope.outputs.nginx_config_changed }}
        run: |
          phase_started=$SECONDS
          phase() {
            now=$SECONDS
            printf '::notice::deploy timing: %s=%ss\n' "$1" "$((now - phase_started))"
            phase_started=$now
          }
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_AGENT_TOKEN"
          ssh_control="$RUNNER_TEMP/deploy-ssh-%C"
          ssh_opts=(-o BatchMode=yes -o ControlMaster=auto -o ControlPersist=60 -o "ControlPath=$ssh_control")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          media_release=$(printf '{"release":"%s","image":"%s"}\n' "$RELEASE" "$MEDIA_PROCESSOR_IMAGE")
          ssh "${ssh_opts[@]}" "$remote" "install -d -m 0700 /var/lib/alexgetman-deploy"
          ssh "${ssh_opts[@]}" "$remote" "umask 077; printf '%s\\n' '$media_release' > /var/lib/alexgetman-deploy/media-processor-release.json"
          runtime=/home/deploy/alexgetman-runtime
          release_files="$runtime/release-files/$RELEASE"
          ssh "${ssh_opts[@]}" "$remote" "install -d -m 0700 '$release_files'"
          release_paths=()
          if [ "$RUNTIME_CONFIG_CHANGED" = "true" ]; then
            release_paths+=(apps/backend/compose.yaml deploy/maru.compose.yaml)
          fi
          if [ "$NGINX_CONFIG_CHANGED" = "true" ]; then
            release_paths+=(deploy/nginx/production/*.conf)
          fi
          if [ "${#release_paths[@]}" -gt 0 ]; then
            tar -cf - "${release_paths[@]}" | ssh "${ssh_opts[@]}" "$remote" "tar -xf - -C '$release_files'"
          fi
          if [ "$RUNTIME_CONFIG_CHANGED" = "true" ]; then
            ssh "${ssh_opts[@]}" "$remote" "set -e; cp '$release_files/apps/backend/compose.yaml' $runtime/compose.yaml.next; docker compose --env-file $runtime/deploy-image.env -f $runtime/compose.yaml.next config --quiet; mv $runtime/compose.yaml.next $runtime/compose.yaml"
          fi
          ssh "${ssh_opts[@]}" "$remote" "set -e; runtime=$runtime; image=\$(bun -e 'const state=JSON.parse(await Bun.file(\"/var/lib/alexgetman-deploy/state.json\").text()); process.stdout.write(state.current?.image ?? \"\")'); printf '%s\\n' \"\$image\" | grep -Eq '^ghcr.io/alexgetmancom/alexgetman-backend@sha256:[0-9a-fA-F]{64}\$' || exit 1; if ! grep -Eq '^BACKEND_IMAGE=ghcr.io/alexgetmancom/alexgetman-backend@sha256:[0-9a-fA-F]{64}\$' \"\$runtime/deploy-image.env\"; then tmp=\"\$runtime/deploy-image.env.next\"; { grep -v '^BACKEND_IMAGE=' \"\$runtime/deploy-image.env\" || true; printf 'BACKEND_IMAGE=%s\\n' \"\$image\"; } > \"\$tmp\"; mv \"\$tmp\" \"\$runtime/deploy-image.env\"; fi"
          if [ "$MARU_DEPLOY_ENABLED" = "true" ]; then
            maru_runtime=/home/deploy/maru
            ssh "${ssh_opts[@]}" "$remote" "set -e; runtime=$maru_runtime; image_id=\$(docker inspect --format '{{.Image}}' maru-backend); image=\$(docker image inspect --format '{{index .RepoDigests 0}}' \"\$image_id\"); printf '%s\\n' \"\$image\" | grep -Eq '^ghcr.io/alexgetmancom/alexgetman-backend@sha256:[0-9a-fA-F]{64}\$' || exit 1; if ! grep -Eq '^BACKEND_IMAGE=ghcr.io/alexgetmancom/alexgetman-backend@sha256:[0-9a-fA-F]{64}\$' \"\$runtime/deploy-image.env\" 2>/dev/null; then tmp=\"\$runtime/deploy-image.env.next\"; { grep -v '^BACKEND_IMAGE=' \"\$runtime/deploy-image.env\" 2>/dev/null || true; printf 'BACKEND_IMAGE=%s\\n' \"\$image\"; } > \"\$tmp\"; mv \"\$tmp\" \"\$runtime/deploy-image.env\"; fi"
            if [ "$RUNTIME_CONFIG_CHANGED" = "true" ]; then
              ssh "${ssh_opts[@]}" "$remote" "set -e; runtime=$maru_runtime; cp '$release_files/deploy/maru.compose.yaml' \$runtime/maru.compose.yaml.next; docker compose --env-file \$runtime/deploy-image.env -f \$runtime/maru.compose.yaml.next config --quiet; mv \$runtime/maru.compose.yaml.next \$runtime/maru.compose.yaml"
            fi
          fi
          phase runtime-config
          if [ "$NGINX_CONFIG_CHANGED" = "true" ]; then
            nginx_files="$release_files/deploy/nginx/production"
            ssh "${ssh_opts[@]}" "$remote" "set -e; sudo install -d -m 0755 /etc/nginx/snippets; sudo install -m 0644 '$nginx_files/shared443.conf' /etc/nginx/stream-conf.d/shared443.conf; sudo install -m 0644 '$nginx_files/marux.ru-ssl.conf' /etc/nginx/sites-enabled/marux.ru-ssl; sudo install -m 0644 '$nginx_files/marux.ru.conf' /etc/nginx/sites-enabled/marux.ru; sudo rm -f /etc/nginx/sites-enabled/marux.ru-bootstrap; sudo install -m 0644 '$nginx_files/alexgetman.com-ssl.conf' /etc/nginx/sites-enabled/alexgetman.com-ssl; sudo install -m 0644 '$nginx_files/alexgetman.com.conf' /etc/nginx/sites-enabled/alexgetman.com; sudo rm -f /etc/nginx/sites-enabled/ialexey.ru-ssl /etc/nginx/sites-enabled/ialexey.ru; sudo install -m 0644 '$nginx_files/alexgetman-proxy-headers.conf' /etc/nginx/snippets/alexgetman-proxy-headers.conf; sudo install -m 0644 '$nginx_files/alexgetman-cache.conf' /etc/nginx/snippets/alexgetman-cache.conf; sudo install -m 0644 '$nginx_files/alexgetman-command-center.conf' /etc/nginx/snippets/alexgetman-command-center.conf; sudo nginx -t; sudo systemctl reload nginx"
          fi
          phase nginx-config
          payload=$(printf '{"image":"%s","release":"%s"}' "$IMAGE" "$RELEASE")
          ssh "${ssh_opts[@]}" "$remote" "curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 420 --max-time 180 -H 'Authorization: Bearer $DEPLOY_AGENT_TOKEN' -H 'Content-Type: application/json' --data '$payload' http://127.0.0.1:9899/v1/deploy"
          phase backend-activation
          curl --fail --silent --show-error --retry 3 --retry-all-errors https://alexgetman.com/readyz &
          public_ready_pid=$!
          ssh "${ssh_opts[@]}" "$remote" "curl --fail --silent --show-error --retry 3 --retry-all-errors http://127.0.0.1:8789/readyz" &
          private_ready_pid=$!
          public_ready_status=0
          private_ready_status=0
          wait "$public_ready_pid" || public_ready_status=$?
          wait "$private_ready_pid" || private_ready_status=$?
          test "$public_ready_status" -eq 0
          test "$private_ready_status" -eq 0
          phase readiness
          # Release files are safe to remove after readiness. Docker cache cleanup
          # is intentionally handled outside the deployment critical path.
          ssh "${ssh_opts[@]}" "$remote" "rm -rf '$release_files'"
          phase cleanup
          ssh "${ssh_opts[@]}" -O exit "$remote" || true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Moved only once production is serving this digest, so the reuse path in
      # the image job can never pick up something that was never deployed.
      - name: Point latest at the deployed image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/alexgetman-backend
          DIGEST: ${{ needs.backend-image.outputs.image_digest }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
      # Published here rather than from a follow-up job: a whole runner boot for
      # one API call sat on the tail of every green deployment.
      - name: Publish production status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success \
            -f context='production deployment' \
            -f description='Image activated and production readiness passed' \
            -f target_url="$TARGET_URL"

  deployment-status-on-ci-failure:
    name: Production deployment status on CI failure
    needs:
      [
        scope,
        quality-static,
        quality-analysis,
        quality-tests,
        build,
        dependency-audit,
        deployment-status-pending,
      ]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (
        needs.scope.result != 'success' ||
        needs.quality-static.result != 'success' ||
        needs.quality-analysis.result != 'success' ||
        needs.quality-tests.result != 'success' ||
        needs.build.result != 'success' ||
        (needs.dependency-audit.result != 'success' && needs.dependency-audit.result != 'skipped')
      )
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark production deployment as blocked
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=failure \
            -f context='production deployment' \
            -f description='CI failed; production deployment was not started' \
            -f target_url="$TARGET_URL"

  # Only the paths `deploy` cannot report on itself: nothing to deploy, or a
  # deployment that never reached its final step.
  deployment-status:
    name: Production deployment status
    needs:
      [
        scope,
        quality-static,
        quality-analysis,
        quality-tests,
        build,
        dependency-audit,
        backend-image,
        media-processor-image,
        deploy,
      ]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.deploy.result != 'success' &&
      needs.scope.result == 'success' &&
      needs.quality-static.result == 'success' &&
      needs.quality-analysis.result == 'success' &&
      needs.quality-tests.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.dependency-audit.result == 'success' || needs.dependency-audit.result == 'skipped')
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish final production status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT_REQUIRED: ${{ needs.scope.outputs.deployment_required }}
          BACKEND_IMAGE_RESULT: ${{ needs.backend-image.result }}
          MEDIA_PROCESSOR_IMAGE_RESULT: ${{ needs.media-processor-image.result }}
        run: |
          if [ "$DEPLOYMENT_REQUIRED" != "true" ]; then
            if [ "$BACKEND_IMAGE_RESULT" = "success" ] && [ "$MEDIA_PROCESSOR_IMAGE_RESULT" = "success" ]; then
              state=success
              description='CI passed; production unchanged'
            else
              state=failure
              description='CI passed quality gates, but image reuse failed; production unchanged'
            fi
          else
            state=failure
            description='Docker build or production deployment failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='production deployment' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
