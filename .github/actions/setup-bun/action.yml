name: Set up Bun workspace
description: Restore the Bun download cache and installed workspace dependencies.

inputs:
  bun-version:
    description: Bun version to install.
    required: true
  cache-key:
    description: Exact cache key for this Bun and workspace dependency tree.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Cache Bun workspace
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.bun/install/cache
          node_modules
          apps/*/node_modules
          tools/*/node_modules
        key: ${{ inputs.cache-key }}
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
