# Canonical Alex production config, deployed verbatim with the compose file.
# Secrets always live in an ignored .env file.
# IANA zone used for every displayed schedule time; timezone_label is the short
# suffix shown next to it (e.g. "18:30 MSK").
timezone: Europe/Moscow
timezone_label: MSK

# Alex serves the public site. Publishing destinations come from the channel
# registry; text, video and analytics always run.
site_enabled: true

video:
  prepare_lead_minutes: 15
  reminder_minutes: 5
  retention_hours: 24

# What this Studio publishes as. These reach RSS titles, llms.txt and the home
# page's structured data, so they are configuration rather than product text.
site:
  name:
    en: Alex Getman
    ru: Алекс Гетман
  tagline:
    en: AI, automation and self-hosted systems
    ru: ИИ, разработка, автоматизация, open-source и проекты
  about:
    en: Alex Getman publishes short practical updates about AI products, automation workflows, developer tools and self-hosted infrastructure.
    ru: Алекс Гетман публикует короткие практические заметки об ИИ-продуктах, автоматизации, инструментах разработки и self-hosted инфраструктуре.
