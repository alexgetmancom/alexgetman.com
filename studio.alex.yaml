# Canonical Alex production config, deployed verbatim with the compose file.
# Secrets always live in an ignored .env file.
display_name: Alex Studio

# IANA zone used for every displayed schedule time; timezone_label is the short
# suffix shown next to it (e.g. "18:30 MSK").
timezone: Europe/Moscow
timezone_label: MSK

# Alex serves the public site. Publishing destinations come from the channel
# registry; text, video and analytics always run.
site_enabled: true

video:
  prepare_lead_minutes: 15
  reminder_minutes: 5
  retention_hours: 24
