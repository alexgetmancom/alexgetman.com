# Both feeds on one Studio: text posting and video posting enabled together.
#
# studio.yaml (alex) publishes text only and studio.video-only.example.yaml
# (maru) publishes video only, so neither of them exercises the unified Command
# Center overview — the mode filter collapses to a single half. Point
# STUDIO_CONFIG at this file to run the dashboard the way it is designed to be
# read, with text and video side by side.
timezone: Europe/Moscow
timezone_label: MSK

modules:
  site: true
  text_posting: true
  video_posting: true
  # The per-platform delivery modules stay off here: switching them on demands
  # real YouTube and Instagram credentials, and the overview reads durable
  # snapshots rather than the publishing APIs.
  youtube: false
  instagram: false
  analytics: true

analytics:
  default_tab: posts

video:
  prepare_lead_minutes: 15
  reminder_minutes: 5
  retention_hours: 24
