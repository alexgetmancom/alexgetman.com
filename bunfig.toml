[test]
# Fail on any network request a test forgot to stub. See the preload for why.
preload = ["./apps/backend/tests/helpers/no-network.ts"]

# Ratchet, not a target. Set just under the measured 78.60% lines / 77.57%
# functions so an untested new module fails CI instead of quietly diluting the
# average. Raise these when coverage rises; never lower them to make CI pass.
coverageThreshold = { line = 0.78, function = 0.77 }
# Test files are trivially ~100% covered by themselves and would inflate the
# average past the point where the threshold means anything.
coverageSkipTestFiles = true
